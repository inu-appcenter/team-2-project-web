name: 개발 작업
description: 기능, 버그, 리팩터링, 문서 및 설정 작업을 등록합니다.
body:
  - type: markdown
    attributes:
      value: |
        하나의 이슈에는 하나의 명확한 작업 목표를 작성해 주세요.

  - type: dropdown
    id: type
    attributes:
      label: 작업 유형
      description: 이슈의 주된 작업 유형을 선택해 주세요.
      options:
        - 기능 개발
        - 버그 수정
        - 리팩터링
        - 문서 작업
        - UI/UX 변경
        - 테스트
        - 성능 개선
        - 보안 개선
        - 빌드 및 설정
        - 배포
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경 및 목적
      description: 이 작업이 필요한 이유와 해결하려는 문제를 작성해 주세요.
      placeholder: 현재 상황, 사용자 문제 또는 기술적인 배경을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 작업 내용
      description: 구현하거나 변경할 내용을 구체적으로 작성해 주세요. 버그라면 재현 방법과 기대 결과를 함께 작성해 주세요.
      placeholder: |
        - 변경할 화면, 기능 또는 코드
        - 주요 동작과 예외 상황
        - 버그 재현 방법과 기대 결과
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 세부 작업
      description: 필요한 작업을 체크리스트로 작성해 주세요.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      description: 이 이슈를 완료로 판단할 수 있는 조건과 검증 방법을 작성해 주세요.
      value: |
        - [ ] 주요 동작을 확인했다.
        - [ ] 관련 정적 검사와 테스트를 통과했다.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 디자인, API 명세, 관련 이슈, 로그 또는 스크린샷을 첨부해 주세요.
    validations:
      required: false
